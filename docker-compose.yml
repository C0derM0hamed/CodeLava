services:
  db:
    image: postgres:18.6-bookworm
    container_name: codelava-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: codelava
      POSTGRES_PASSWORD: codelava_dev_pw
      POSTGRES_DB: codelava
    ports:
      - "5433:5432"
    volumes:
      - codelava-db:/var/lib/postgresql
volumes:
  codelava-db:
